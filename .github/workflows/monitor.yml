name: Spor Istanbul Monitor

on:
  schedule:
    # GitHub cron is in UTC and best-effort (may be delayed a few minutes).
    - cron: "*/7 * * * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

# If a run is still going when the next one starts, skip the new one.
concurrency:
  group: spor-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run one check
        env:
          SPOR_TC: ${{ secrets.SPOR_TC }}
          SPOR_PASSWORD: ${{ secrets.SPOR_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEARTBEAT: ${{ vars.HEARTBEAT || 'true' }}
        run: python monitor.py --once
