name: Spor Istanbul Monitor

on:
  # NOTE: The target site (online.spor.istanbul) is behind Cloudflare bot
  # protection, which blocks datacenter IPs like GitHub's runners. Scheduled
  # runs are therefore DISABLED — this site must be monitored from a
  # residential (home) IP. Manual dispatch is kept only for testing.
  workflow_dispatch: {}

# If a run is still going when the next one starts, skip the new one.
concurrency:
  group: spor-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run one check
        env:
          SPOR_TC: ${{ secrets.SPOR_TC }}
          SPOR_PASSWORD: ${{ secrets.SPOR_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEARTBEAT: ${{ vars.HEARTBEAT || 'true' }}
        run: python monitor.py --once

      - name: Upload debug snapshot (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-snapshot
          path: |
            debug_page.png
            debug_page.html
          if-no-files-found: ignore
          retention-days: 3
